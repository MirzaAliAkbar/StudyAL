{% extends "base.html" %}
{% block title %}Subjects{% endblock %}
{% block content %}
<h2>My Subjects</h2>
<a href="{{ url_for('subjects.deadlines') }}" class="btn btn-secondary mb-3">Manage Deadlines</a>
<form method="POST" class="mb-4">
    <div class="row">
        <div class="col-md-6">
            <input type="text" name="name" class="form-control" placeholder="Subject name (e.g. Math)" required>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Add Subject</button>
        </div>

    </div>
</form>

{% if subjects %}
    <ul class="list-group">
        {% for subject in subjects %}
            <li class="list-group-item d-flex justify-content-between">
                {{ subject.name }}
                <a href="{{ url_for('subjects.delete', subject_id=subject.id) }}" class="text-danger">Delete</a>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p> No subjects yet. Add one above.</p>

{% endif %}
{% endblock %}
